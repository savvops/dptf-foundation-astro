# PagesCMS Configuration for DPTF Foundation
# Simplified version for testing

media:
  - name: images
    label: Images
    input: public/images
    output: /images

content:
  # Site Settings
  - name: siteSettings
    label: Site Settings
    type: file
    path: src/content/siteSettings/settings.json
    fields:
      - name: siteName
        label: Site Name
        type: string
      - name: siteDescription
        label: Site Description
        type: string

  - name: navigation
    label: Navigation Links
    type: collection
    path: src/content/navigation
    fields:
      - name: id
        label: ID
        type: string
      - name: label
        label: Label
        type: string
      - name: href
        label: URL
        type: string
      - name: order
        label: Order
        type: number
      - name: enabled
        label: Enabled
        type: boolean

  # Homepage
  - name: homepage
    label: Homepage Sections
    type: collection
    path: src/content/homepage
    fields:
      - name: section
        label: Section ID
        type: string
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: enabled
        label: Enabled
        type: boolean

  - name: stats
    label: Homepage Stats
    type: collection
    path: src/content/stats
    fields:
      - name: id
        label: ID
        type: string
      - name: number
        label: Number
        type: number
      - name: label
        label: Label
        type: string
      - name: enabled
        label: Enabled
        type: boolean

  - name: coreValues
    label: Core Values
    type: collection
    path: src/content/coreValues
    fields:
      - name: id
        label: ID
        type: string
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: enabled
        label: Enabled
        type: boolean

  - name: objectives
    label: Objectives
    type: collection
    path: src/content/objectives
    fields:
      - name: id
        label: ID
        type: string
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: enabled
        label: Enabled
        type: boolean

  # About
  - name: aboutSettings
    label: About Settings
    type: file
    path: src/content/aboutSettings/settings.json
    fields:
      - name: pageTitle
        label: Page Title
        type: string
      - name: headerTitle
        label: Header Title
        type: string

  - name: board
    label: Board Members
    type: collection
    path: src/content/board
    fields:
      - name: id
        label: ID
        type: string
      - name: name
        label: Name
        type: string
      - name: role
        label: Role
        type: string
      - name: description
        label: Description
        type: string
      - name: image
        label: Image
        type: string
      - name: category
        label: Category
        type: string
      - name: order
        label: Order
        type: number
      - name: enabled
        label: Enabled
        type: boolean

  - name: timeline
    label: Timeline
    type: collection
    path: src/content/timeline
    fields:
      - name: id
        label: ID
        type: string
      - name: year
        label: Year
        type: string
      - name: title
        label: Title
        type: string
      - name: event
        label: Event
        type: string
      - name: enabled
        label: Enabled
        type: boolean

  # Programs
  - name: programs
    label: Programs
    type: collection
    path: src/content/programs
    fields:
      - name: id
        label: ID
        type: string
      - name: title
        label: Title
