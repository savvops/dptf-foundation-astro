        label: ID
        type: string
      - name: label
        label: Label
        type: string
      - name: href
        label: URL
        type: string
      - name: order
        label: Order
        type: number
      - name: isButton
        label: Is Button
        type: boolean
      - name: enabled
        label: Enabled
        type: boolean

  - name: footerSettings
