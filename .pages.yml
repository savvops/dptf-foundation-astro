# PagesCMS Configuration for DPTF Foundation
# Full configuration with all 37 content collections

media:
  - name: images
    label: Images
    input: public/images
    output: /images
    path: /images

content:
  # ==================== SITE SETTINGS ====================
  - name: siteSettings
    label: Site Settings
    type: file
    path: src/content/siteSettings/settings.json
    fields:
      - name: siteName
        label: Site Name
        type: string
      - name: siteDescription
        label: Site Description
        type: string
      - name: defaultTitle
        label: Default Page Title
        type: string
      - name: defaultDescription
        label: Default Meta Description
        type: string
      - name: logo
        label: Logo Path
        type: string
      - name: favicon
        label: Favicon Path
        type: string

  - name: navigation
    label: Navigation Links
    type: collection
    path: src/content/navigation
    fields:
